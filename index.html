<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="FlightWall" />
  <title>FlightWall Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card: #0c0e12;
      --border: #1e2430;
      --text: #f3f4f6;
      --muted: #8b949e;
      --amber: #f59e0b;
      --green: #10b981;
      --blue: #38bdf8;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* 4:3 Landscape Grid */
    .dashboard {
      display: grid;
      grid-template-rows: 16% 48% 36%;
      gap: 14px;
      width: 100vw;
      height: 100vh;
      padding: 16px 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 22px;
    }

    /* TOP ROW: Clock & Weather */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clock-group {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    #clock {
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: -1.5px;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
    }

    #date {
      font-size: 1.3rem;
      font-weight: 500;
      color: var(--muted);
    }

    .weather-group {
      display: flex;
      align-items: center;
      gap: 22px;
      text-align: right;
    }

    #temp {
      font-size: 2.7rem;
      font-weight: 700;
      color: var(--amber);
      font-variant-numeric: tabular-nums;
    }

    .weather-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #weather-desc {
      font-size: 1.15rem;
      font-weight: 600;
    }

    #loc-status {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* MIDDLE ROW: Closest Overhead Flight */
    .hero-flight {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      align-items: center;
      position: relative;
    }

    .hero-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .operator-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-box {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      background: #161b22;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-box img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .logo-fallback {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--amber);
      letter-spacing: 1px;
    }

    .callsign-block h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .callsign-block p {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Route & Progress Bar */
    .route-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 4px 0;
    }

    .route-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .airport-code {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
    }

    .progress-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 0 8px;
    }

    .progress-track {
      position: relative;
      width: 100%;
      height: 6px;
      background: #1e2430;
      border-radius: 999px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blue), var(--amber));
      border-radius: 999px;
      transition: width 0.6s ease;
    }

    .progress-plane {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      font-size: 1.25rem;
      color: var(--amber);
      text-shadow: 0 0 8px rgba(0,0,0,0.9);
      transition: left 0.6s ease;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* 6-Cell Telemetry Strip */
    .telemetry-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      background: #07090c;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
    }

    .tele-item span {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .tele-item strong {
      font-size: 1.08rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--blue);
      white-space: nowrap;
    }

    .vrate-climb { color: var(--green) !important; }
    .vrate-desc  { color: var(--amber) !important; }
    .vrate-level { color: var(--muted) !important; }
    .squawk-emerg { color: var(--red) !important; }

    .hero-right {
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #07090c;
      border: 1px solid var(--border);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #plane-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #photo-placeholder {
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
      padding: 20px;
    }

    #photo-credit {
      position: absolute;
      bottom: 6px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      color: #ccc;
    }

    /* BOTTOM ROW: Last 3 / Current / Next 3 Table */
    .queue-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      text-align: left;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 6px 4px;
      font-size: 0.98rem;
      border-bottom: 1px solid #131720;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    tr.row-past td {
      color: #6e7681;
    }

    tr.row-current {
      background: rgba(245, 158, 11, 0.14);
    }

    tr.row-current td {
      color: #ffffff;
      font-weight: 700;
      border-top: 1px solid rgba(245, 158, 11, 0.4);
      border-bottom: 1px solid rgba(245, 158, 11, 0.4);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-past { background: #161b22; color: #8b949e; }
    .badge-now  { background: var(--amber); color: #000000; }
    .badge-next { background: #0c2d48; color: var(--blue); }
  </style>
</head>
<body>

<div class="dashboard">
  <!-- TOP: Clock & Weather -->
  <div class="card top-bar">
    <div class="clock-group">
      <div id="clock">--:--</div>
      <div id="date">Loading date...</div>
    </div>
    <div class="weather-group">
      <div class="weather-meta">
        <div id="weather-desc">Loading weather...</div>
        <div id="loc-status">Locating Wi-Fi...</div>
      </div>
      <div id="temp">--°</div>
    </div>
  </div>

  <!-- MIDDLE: Closest Overhead Flight -->
  <div class="card hero-flight">
    <div class="hero-left">
      <div class="operator-header">
        <div class="logo-box" id="logo-container">
          <span class="logo-fallback" id="logo-fallback">ADS-B</span>
          <img id="operator-logo" alt="" style="display:none;" />
        </div>
        <div class="callsign-block">
          <h1 id="hero-callsign">SCANNING SKY...</h1>
          <p id="hero-airline">Searching within 15 NM of iPad</p>
        </div>
      </div>

      <!-- Route + Live Progress Bar -->
      <div class="route-section">
        <div class="route-banner">
          <div class="airport-code" id="hero-origin">---</div>
          <div class="progress-wrapper">
            <div class="progress-track">
              <div class="progress-fill" id="progress-fill"></div>
              <div class="progress-plane" id="progress-plane">✈</div>
            </div>
            <div class="progress-labels">
              <span id="progress-elapsed">-- NM flown</span>
              <span id="progress-pct">--%</span>
              <span id="progress-rem">-- NM left</span>
            </div>
          </div>
          <div class="airport-code" id="hero-dest">---</div>
        </div>
      </div>

      <!-- 6-Metric Telemetry Strip -->
      <div class="telemetry-strip">
        <div class="tele-item">
          <span>Aircraft</span>
